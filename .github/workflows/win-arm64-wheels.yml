# Build grpcio wheels for Windows on Arm (win_arm64), which PyPI does not provide.
# Built from the PyPI sdist (hash-pinned), which already vendors third_party sources.
name: grpcio win_arm64 wheels

on:
  push:
    branches: [win-arm64-wheels]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-11-arm
    strategy:
      fail-fast: false
      matrix:
        python: ["3.13", "3.14"]
    env:
      GRPCIO_VERSION: "1.85.4"
      GRPCIO_SHA256: "45c4efd77dbfbb92cfebe493518c7e2a97ef3f4da2673508f81214b7493d7cca"
      GRPC_PYTHON_BUILD_EXT_COMPILER_JOBS: "4"
    steps:
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ matrix.python }}
          architecture: arm64
      - name: Show interpreter
        run: python -c "import platform, sys; print(sys.version, platform.machine())"
      - name: Download and verify sdist
        # Fetch the file directly: `pip download --no-binary :all:` would also force the
        # build dependencies (Cython) to compile from source.
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          $meta = Invoke-RestMethod "https://pypi.org/pypi/grpcio/$env:GRPCIO_VERSION/json"
          $sd = $meta.urls | Where-Object { $_.packagetype -eq "sdist" } | Select-Object -First 1
          New-Item -ItemType Directory -Force sdist | Out-Null
          $f = Join-Path sdist $sd.filename
          Invoke-WebRequest $sd.url -OutFile $f
          $h = (Get-FileHash $f -Algorithm SHA256).Hash.ToLower()
          if ($h -ne $env:GRPCIO_SHA256) { throw "sdist hash mismatch: $h" }
          "SDIST=$((Resolve-Path $f).Path)" | Out-File -Append $env:GITHUB_ENV
      - name: Build wheel
        # Same toolchain pins as grpc's tools/run_tests/artifacts/build_artifact_python.bat.
        # Newer setuptools (84.x) bypasses grpc's _spawn_patch, so MSVC gets both
        # /std:c++17 and /std:c11 (error D8016).
        env:
          NO_CYTHON_COMPILE: "true"
        run: |
          python -m pip install setuptools==77.0.1 wheel==0.43.0 cython==3.2.8 packaging
          python -m pip wheel "${{ env.SDIST }}" --no-deps --no-build-isolation -w wheelhouse -v
      - name: Smoke test
        shell: pwsh
        run: |
          $w = Get-ChildItem wheelhouse -Filter "*.whl" | Select-Object -First 1
          python -m pip install $w.FullName
          python -c "import grpc, platform; print(grpc.__version__, platform.machine())"
          Get-FileHash $w.FullName -Algorithm SHA256 | Format-List
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: grpcio-${{ env.GRPCIO_VERSION }}-py${{ matrix.python }}-win_arm64
          path: wheelhouse/*.whl
